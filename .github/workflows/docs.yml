name: Deploy docs

# Builds the site in docs/ and publishes it to GitHub Pages. The checked-in
# HTML uses {{REPO_URL}} in place of this repository's own GitHub URL, so
# the page works correctly under whatever org/repo it's forked or renamed
# to, without anyone hand-editing a hardcoded link.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push supersedes one still in flight
# rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Substitute the repository URL
        # Copies docs/ to a build output directory and fills in {{REPO_URL}}
        # there, leaving the checked-in source untouched so the repo itself
        # never carries a stale or environment-specific link.
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          repo_url="${{ github.server_url }}/${{ github.repository }}"
          grep -rl '{{REPO_URL}}' _site | while read -r f; do
            sed -i "s#{{REPO_URL}}#${repo_url}#g" "$f"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
